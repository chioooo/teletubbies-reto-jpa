name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: store
          MYSQL_USER: iwa
          MYSQL_PASSWORD: demo
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila y corre las pruebas. Al levantar el contexto de Spring,
      # Flyway aplica todas las migraciones sobre la base vacía:
      # si alguna tiene error de SQL o un nombre inválido, el CI falla.
      - name: Build and validate migrations
        run: mvn -B clean verify
