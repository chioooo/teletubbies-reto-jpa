# Desde la raíz del proyecto:
#
#   docker compose up -d                          solo la base (MySQL, puerto 3308)
#   docker compose --profile api up -d --build    la base y la API (puerto 8080)
#   docker compose --profile api down             detiene todo (conserva los datos)
#   docker compose --profile api down -v          detiene todo y borra la base
#
# La base usa otro contenedor y otro puerto que la práctica SQL (3307), para que
# las migraciones de esa semana no interfieran.

name: store-jpa

services:
  db:
    image: mysql:8.4
    container_name: store-jpa-db
    environment:
      MYSQL_DATABASE: store
      MYSQL_USER: iwa
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root_password
    restart: always
    ports:
      - "3308:3306"
    volumes:
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Opcional: solo se levanta con --profile api
  api:
    profiles: ["api"]
    build: .
    container_name: store-jpa-api
    environment:
      # Dentro de la red de Docker la base se llama "db" y escucha en 3306
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
